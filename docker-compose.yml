version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: agentmonitor-postgres
    env_file: .env
    environment:
      # 生产部署必须在 .env 中设置强密码 PG_PASSWORD（不提供弱默认值）。
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD must be set in .env}
      POSTGRES_DB: ${PG_DATABASE:-agentmonitor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentmonitor-backend
    expose:
      - "3000"
    env_file: .env
    environment:
      NODE_ENV: production
      DB_TYPE: postgres
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD must be set in .env}
      PG_DATABASE: ${PG_DATABASE:-agentmonitor}
      # 容器内通过 Docker 内网连接自带 PostgreSQL，链路不启用 TLS，必须显式关闭，
      # 否则生产环境默认 DB_SSL=true 会导致后端连库失败。
      # 若使用云端带 TLS 的托管数据库，请改为 DB_SSL=true 并移除本覆盖文件中的 PG_HOST。
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentmonitor-frontend
    ports:
      # 主机端口可通过 .env 的 FRONTEND_HTTP_PORT / FRONTEND_HTTPS_PORT 覆盖，
      # 避免与同机其它服务（如占用 80 的容器）冲突；HTTPS 默认走 443。
      - "${FRONTEND_HTTP_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

volumes:
  pgdata:
